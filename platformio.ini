; =============================================================================
; Nucleus root project -- HOST TESTS ONLY.
;
; The firmware lives in its own PlatformIO project (flagship_p4/, pure ESP-IDF,
; `pio run -d flagship_p4`). This file exists so the first-party header-only
; libraries under lib/ have a native gate: geiger and flux are hardware-free
; by contract, and this env is what proves it. Adding a firmware
; environment here would re-create the ulp/ directory trap flagship_p4's own
; platformio.ini documents -- do not.
;
; Kinetic is the sibling checkout kinetic.pin names (../Kinetic beside this
; repo), consumed in place, never copied here. Nucleus plans with Kinetic²
; (include/kinetic2), the one planner in that repo.
;
; Toolchain: WinLibs MinGW-w64 on PATH. Run the binary from POWERSHELL; Git
; Bash returns exit 127 for program.exe with no output, which is a shell
; artifact and never a broken suite. `-f` needs the subdirectory
; (`-f native/test_kinetic`); a bare suite name matches nothing, reports
; "0 test cases", exits clean and leaves the PREVIOUS suite's binary in place.
; Trust the process exit code, not the runner's parsed summary.
; =============================================================================

[env:native]
platform = native
test_framework = doctest
test_filter = native/*
lib_deps =
	symlink://../Kinetic
; Header-only cores under test are included directly by the test sources, so
; there is no src/ to compile. LDF stays at default chain mode: it resolves
; both the doctest package headers and lib/*/include (LDF=off hides them).
; test_kinetic compiles Kinetic²'s own suite, ../Kinetic/tests/test_kinetic2.cpp.
; flagship_p4/src resolves "hub/valence_config.h" for the firmware units
; under test here, the hardware-free MotionArbiter (test_motion_arbiter) and
; PatternEngine (test_pattern_engine). The last two paths are the vendored
; StrokeEngine patterns and the <Arduino.h> adapter they compile against.
; -ffp-contract=off is the determinism rule (tools/kinetic-wasm/README.md):
; test_kinetic_wasm_trace records the trace kinetic.wasm must match bit for bit.
build_flags =
	-std=gnu++2b
	-O2
	-ffp-contract=off
	-Wall
	-Iflagship_p4/src
	-Ilib/strokeengine_patterns/include
	-Iflagship_p4/src/patterns/arduino_compat
