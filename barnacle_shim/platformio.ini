; =============================================================================
; BARNACLE SHIM -- the OSSM R+D board's ESP32-WROOM-32D as nucleus-p4b's I/O
; helper (bd val-omh3.3). Arduino on the pinned pioarduino platform, never
; espressif32@6.x.
;
; Its OWN PlatformIO project, beside flagship_p4/ and never merged into it:
; another chip, another framework. The link's frames and the trip detector
; are ../lib/barnacle_link (shared with flagship_p4), the LED grammar
; ../lib/flux; both header-only, reached by include path alone.
;
; Build:  pio run -d barnacle_shim
; Flash:  over the R+D board's own USB-C (the CP2102 on UART0), with the
;         J8 loom unplugged or the Stamp unpowered. The shim never touches
;         UART0, so the ROM loader always answers there.
; =============================================================================

[platformio]
default_envs = barnacle_shim

[env:barnacle_shim]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags =
	-I$PROJECT_DIR/../lib/barnacle_link/include
	-I$PROJECT_DIR/../lib/flux/include
	-Wall
