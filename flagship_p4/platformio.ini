; =============================================================================
; FLAGSHIP P4 -- ESP32-P4 board for the flagship PCB. Pure ESP-IDF.
;
; ITS OWN PlatformIO PROJECT, and that is load-bearing, not tidiness. The ULP
; build hook resolves ONE directory, $PROJECT_DIR/ulp, with no per-environment
; override (platform 55.03.39: espidf.py:2957, ulp.py:64). A ulp/ directory in
; the machine repo's root would be compiled into the ESP32-S3 production build
; too -- esp32s3 is NOT in that hook's exclusion list -- and only on the rare
; builds that rebuild the Arduino libs, which is the same event the
; custom_sdkconfig trap already teaches us to retry rather than diagnose.
; A separate PROJECT_DIR scopes ulp/ structurally. Never merge this back.
;
; PURE ESP-IDF, NOT ARDUINO, and that is also load-bearing (ruling 2026-09-20,
; sd-1bi.3). Under framework=arduino the ULP binary is built in hybrid mode's
; throwaway stage-1 project and never reaches the final link: measured, nm on
; firmware.elf carried no _binary_ulp_main_bin_* symbol. The only Arduino shape
; that links a ULP binary is 'arduino, espidf' -- an IDF project with Arduino
; bolted on -- and every failure on the way here (34 KB include command line,
; esp-modbus's own broken assert, the sdkconfig choice that would not flip)
; was the Arduino component manifest, not the P4. sdkconfig.defaults is the
; native home for what custom_sdkconfig had to smuggle.
;
; TWO pioarduino TRAPS, both measured 2026-09-20:
; 1. After ANY sdkconfig.defaults change that moves the memory map (silicon
;    revision, cache size, PSRAM, ULP reserve), $BUILD_DIR/memory.ld is NOT
;    regenerated; sections.ld is. A rev-3 memory map under a pre-rev-3
;    sections script links every SRAM section at 0x0: entry point ~0xc94,
;    "Instruction access fault PC=0x00000c94" from the bootloader, watchdog
;    loop. Cure is a CLEAN build (delete .pio). Do not chase it in the config.
; 2. framework=arduino cannot ship a ULP binary at all: hybrid mode builds it in
;    a throwaway stage and the final link never sees it (nm: no
;    _binary_ulp_main_bin_*). That is why this project is pure ESP-IDF.
;
; Build:  pio run -d flagship_p4
; Flash:  pio run -d flagship_p4 -t upload
; =============================================================================

[env:flagship_p4]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
; board MUST be esp32-p4 (chip_variant esp32p4_es, 360 MHz), NOT esp32-p4_r3.
; This stamp's ROM identifies as esp32p4-eco2, i.e. pre rev.300 engineering
; silicon. A rev.300 image panics with an illegal instruction at the app entry
; point and watchdog-reboots forever (verified on hardware 2026-09-20).
; The IDF-side half of this fact is the ESP32P4_SELECTS_REV_LESS_V3 block in
; sdkconfig.defaults; the board manifest does not carry it.
board = esp32-p4
; The generic ES board declares 4 MB; the stamp carries 16 MB. The IDF-side
; twin of this override is CONFIG_ESPTOOLPY_FLASHSIZE_16MB in sdkconfig.defaults.
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
; PlatformIO builds partitions.bin from THIS, never from sdkconfig's
; CONFIG_PARTITION_TABLE_*. The pio default gives the factory app 1 MB and
; the image is 1.31 MB, which fails at BOOT ("Image length ... doesn't fit")
; in a reset loop, not at link. See flagship_p4/partitions.csv.
board_build.partitions = partitions.csv
framework = espidf
monitor_speed = 115200
; COM15 on this bench. COM7 is an unrelated C3 air-quality node, COM11 the S3
; and COM13 the C5 -- do not flash this env at any of them.
upload_port = COM15
monitor_port = COM15
