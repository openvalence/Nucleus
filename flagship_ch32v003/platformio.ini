; =============================================================================
; FLAGSHIP CH32V003 -- the board monitor (U12) on the OSSM Flagship.
;
; Its own PlatformIO project, per repo-layout.md: one chip, one project.
; Bare metal on ch32v003fun. The P4 programs this chip over SWIO and carries
; its image inside the Nucleus OTA (val-091.20), so a flash from here is a
; bench path through a WCH-LinkE on the rescue pads, never the product path.
;
; The link message set is flagship_p4/src/system/Supervisor.h, shared with
; the P4; the include path below is how this project reaches it.
; monitor_core.c is hardware-free and is tested on the host by the root
; project's native env (test/native/test_supervisor).
;
; Build:  pio run -d flagship_ch32v003
; =============================================================================

[env:monitor]
platform = https://github.com/Community-PIO-CH32V/platform-ch32v.git
board = genericCH32V003F4U6
framework = ch32v003fun
build_flags =
	-I../flagship_p4/src
	-I.
